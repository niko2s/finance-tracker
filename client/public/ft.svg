  </style>

  <rect x="12" y="12" width="232" height="232" rx="28" class="bg" />
  <rect x="12" y="12" width="232" height="232" rx="28" class="b" />

  <!-- F -->
  <text x="20" y="180" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="160" class="f">
    F
  </text>

  <!-- T -->
  <text x="110" y="180" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="160" class="t">
